# Reusable components
components:
  hero:
    label: Hero Section
    type: object
    fields:
      - name: headline
        label: Headline
        type: string
        required: true
      - name: subheading
        label: Subheading
        type: text
      - name: image
        label: Background Image
        type: image
      - name: cta_button
        label: Call-to-Action Button
        type: object
        fields:
          - name: text
            label: Button Text
            type: string
          - name: url
            label: Button URL
            type: string

  seo:
    label: SEO Settings
    type: object
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
      - name: description
        label: Meta Description
        type: text
        required: true
      - name: keywords
        label: Keywords
        type: string
        list: true
      - name: og_image
        label: Social Media Image
        type: image

# Global settings
settings:
  content:
    merge: true
