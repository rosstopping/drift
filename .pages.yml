        required: true
      - label: Hero Description
        name: hero_description
        type: text
        required: true
      - label: Hero Background Image
        name: hero_image
        type: image
        required: true
      - label: CTA Section Title
        name: cta_title
        type: string
        required: true
      - label: CTA Description
        name: cta_description
        type: text
        required: true
      - label: CTA Button Text
        name: cta_button_text
        type: string
        required: true
      - label: CTA Button URL
        name: cta_button_url
        type: string
        required: true
      - label: Main Content
        name: body
        type: rich-text
        required: true

  # Resources page
  - label: Resources Page
    name: resources
    path: content/resources.md
    type: file
    fields:
      - label: Title
        name: title
        type: string
        required: true
      - label: Meta Description
        name: description
        type: text
      - label: Hero Title
        name: hero_title
        type: string
        required: true
      - label: Hero Description
        name: hero_description
        type: text
        required: true
      - label: Hero Background Image
        name: hero_image
        type: image
        required: true
      - label: CTA Section Title
        name: cta_title
        type: string
        required: true
      - label: CTA Description
        name: cta_description
        type: text
        required: true
      - label: CTA Button Text
        name: cta_button_text
        type: string
        required: true
      - label: CTA Button URL
