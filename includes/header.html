<div class="w-full py-4 md:py-12 relative bg-green-950/80 lg:bg-transparent">
	<div data-aos="fade-in" data-aos-delay="200"
		class="z-10 w-1/2 h-full bg-green-950/80 absolute top-0 left-0 -ml-20 hidden lg:block">
	</div>
	<div data-aos="fade-in" data-aos-delay="400"
		class="flex max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 items-center justify-between relative z-10">
		<!-- Logo -->
		<div class="flex-shrink-0">
			<include src="logo.html"></include>
		</div>

		<!-- Desktop Navigation -->
		<nav class="hidden md:flex space-x-6 items-center">
			<ForEach collection="menu" root="items" as="item" orderBy="order">
				<a href="{item.link}"
					class="text-lg tracking-wide font-display italic text-white lg:text-zinc-900">{item.title}</a>
			</ForEach>
		</nav>

		<!-- Mobile Menu Button -->
		<button x-data="{ mobileMenuOpen: false }"
			@click="mobileMenuOpen = true; $dispatch('toggle-mobile-menu', { open: true })"
			class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20"
			aria-label="Toggle mobile menu">
			<svg class="w-6 h-6 text-zinc-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
				<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
				</path>
			</svg>
		</button>
	</div>
</div>

<!-- Mobile Navigation Menu (Outside header container) -->
<div x-data="{ mobileMenuOpen: false }" @toggle-mobile-menu.window="mobileMenuOpen = $event.detail.open"
	@keydown.escape.window="mobileMenuOpen = false" class="md:hidden">

	<div x-show="mobileMenuOpen" x-transition:enter="transition ease-out duration-300"
		x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
		x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
		x-transition:leave-end="opacity-0" class="fixed inset-0 z-[9999]" style="display: none;">

		<!-- Backdrop -->
		<div @click="mobileMenuOpen = false" class="fixed inset-0 bg-black/50 backdrop-blur-sm"></div>

		<!-- Menu Panel -->
		<div x-transition:enter="transition ease-out duration-300 transform" x-transition:enter-start="translate-x-full"
			x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200 transform"
			x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
			class="fixed top-0 right-0 h-screen w-80 max-w-[80vw] bg-white shadow-2xl overflow-y-auto">

			<!-- Header -->
			<div class="flex items-center justify-between p-6 border-b border-gray-100 bg-white sticky top-0">
				<!-- <include src="logo.html"></include> -->
				<button @click="mobileMenuOpen = false" class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
					aria-label="Close menu">
					<svg class="w-6 h-6 text-zinc-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
						</path>
					</svg>
				</button>
			</div>

			<!-- Navigation Links -->
			<nav class="p-6">
				<div class="space-y-2">
					<ForEach collection="menu" root="items" as="item" orderBy="order">
						<a href="{item.link}" @click="mobileMenuOpen = false"
							class="block py-4 px-4 rounded-lg text-lg font-display italic text-zinc-900 hover:bg-green-950/80 hover:text-white transition-colors tracking-wide border-b border-gray-50 last:border-b-0">
							{item.title}
						</a>
					</ForEach>
				</div>
			</nav>
		</div>
	</div>
</div>
