<div class="relative pt-8 pb-20">
	<div data-aos="fade-in" data-aos-delay="200"
		class="z-10 w-1/2 h-full bg-green-950/80 absolute top-0 left-0 -ml-20 hidden lg:block">
	</div>

	<div class="max-w-7xl mx-auto px-6 flex flex-wrap h-full relative z-10">

		<div class="w-full md:w-1/2 h-full">
			<img data-aos="fade-in" src="{hero_image}" class="w-full h-full max-h-[600px] object-cover object-bottom">
		</div>

		<div x-data="{
			hero_cta_url: '{hero_cta_url}', init() {
			console.log(this.hero_cta_url);
		} }" class="w-full md:w-1/2 px-0 md:px-12 py-12 flex justify-center items-center">

			<div class="max-w-sm">
				<h1 data-aos="fade-in" data-aos-delay="100" data-aos-duration="500"
					class="text-5xl max-w-2xl mx-auto leading-tight font-display font-semibold text-zinc-800">
					{hero_title}
				</h1>
				<div data-aos="fade-in" data-aos-delay="200" data-aos-duration="500"
					class="mt-6 prose leading-relaxed text-zinc-600">
					<p>{hero_description}</p>
				</div>
				<div x-show="hero_cta_url != ''">
					<div data-aos="fade-in" data-aos-delay="500">
						<a href="{hero_cta_url}"
							class="no-underline mt-10 inline-flex justify-between items-center gap-4 hover:gap-8  text-white py-3 px-6 hover:px-8 max-w-xl uppercase text-sm tracking-widest bg-green-950/80 hover:bg-green-950/80 hover:text-white transition-all ease-in-out rounded-full">
							<span>{hero_cta_text}</span>
							<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1"
								stroke="currentColor" class="size-6">
								<path stroke-linecap="round" stroke-linejoin="round"
									d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"></path>
							</svg>
						</a>
					</div>
				</div>
			</div>

		</div>
	</div>
</div>
