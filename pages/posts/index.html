<layout title="{frontmatter.title}" src="main.html">

	<!-- Hero Section -->
	<div class="relative pt-20 pb-24 bg-black">
		<img class="absolute inset-0 w-full h-full opacity-25 object-cover" src="{frontmatter.featured_image}" />

		<div class="max-w-4xl mx-auto px-6 text-center relative z-10">
			<h1 data-aos="fade-in" class="text-5xl font-display font-semibold text-white mb-6">
				{frontmatter.title}
			</h1>

			<!-- Meta Information -->
			<div data-aos="fade-in" data-aos-delay="200"
				class="flex items-center justify-center space-x-6 text-white/80 mb-6">
				<span class="flex items-center">
					<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
					</svg>
					{frontmatter.author}
				</span>
				<span class="flex items-center">
					<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
						</path>
					</svg>
					{frontmatter.date}
				</span>
			</div>

			<!-- Excerpt -->
			<If condition="frontmatter.excerpt">
				<p data-aos="fade-in" data-aos-delay="300"
					class="text-xl text-white/90 max-w-2xl mx-auto leading-relaxed">
					{frontmatter.excerpt}
				</p>
			</If>
		</div>
	</div>

	<!-- Main Content -->
	<article class="py-20">
		<div class="max-w-4xl mx-auto px-6">
			<div class="prose prose-lg prose-zinc max-w-none" data-aos="fade-in">
				{content}
			</div>
		</div>
	</article>

</layout>
